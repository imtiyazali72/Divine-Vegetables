services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: divine-veg-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: divine-veg-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.10.12

  # 2. React Vite Frontend Static Site
  - type: web
    name: divine-veg-frontend
    env: static
    region: singapore
    buildCommand: cd admin-panel && npm install && npm run build
    staticPublishPath: admin-panel/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: divine-veg-backend
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # 3. Persistent Free Managed PostgreSQL Database
  - name: divine-veg-db
    databaseName: divine_vegetables
    user: divine_user
    region: singapore
    plan: free
